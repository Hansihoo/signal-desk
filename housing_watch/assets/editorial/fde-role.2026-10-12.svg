<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#7350ad" stroke-width="2"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#fbfaff"/><text x="64" y="64" font-size="25" fill="#7350ad" font-weight="700">01 / 역할</text><text x="64" y="132" font-size="47" fill="#29243e" font-weight="700">제품을 고객의 실제 업무에 적용합니다</text><text x="64" y="192" font-size="29" fill="#656078" font-weight="400">고객에게 필요한 연결을 구현하고, 현장 경험을 제품으로 되돌립니다.</text><rect x="64" y="270" width="410" height="332" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="96" y="324" font-size="36" fill="#29243e" font-weight="700">고객의 업무</text><text x="96" y="396" font-size="31" fill="#656078" font-weight="400">해결할 문제</text><text x="96" y="448" font-size="31" fill="#656078" font-weight="400">사용 중인 데이터</text><text x="96" y="500" font-size="31" fill="#656078" font-weight="400">기존 프로그램과 규칙</text><rect x="564" y="270" width="410" height="332" rx="12" fill="#efe9f8" stroke="#7350ad" stroke-width="2"/><text x="596" y="324" font-size="36" fill="#7350ad" font-weight="700">FDE가 연결</text><text x="596" y="396" font-size="31" fill="#29243e" font-weight="400">문제를 구체화</text><text x="596" y="448" font-size="31" fill="#29243e" font-weight="400">제품 기능과 데이터 연결</text><text x="596" y="500" font-size="31" fill="#29243e" font-weight="400">구현 · 실제 사용 확인</text><rect x="1064" y="270" width="408" height="332" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="1096" y="324" font-size="36" fill="#29243e" font-weight="700">작동하는 해결책</text><text x="1096" y="396" font-size="31" fill="#656078" font-weight="400">고객 업무에서 사용</text><text x="1096" y="448" font-size="31" fill="#656078" font-weight="400">반복 입력과 전달 개선</text><text x="1096" y="500" font-size="31" fill="#656078" font-weight="400">새 기능과 서비스 제공</text><path d="M490,436 L548,436" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><path d="M990,436 L1048,436" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><rect x="220" y="698" width="1096" height="116" rx="12" fill="#f4f0f9" stroke="#d9d1e5" stroke-width="2"/><text x="260" y="769" font-size="37" fill="#7350ad" font-weight="700">반복되는 현장 요구 → 공급사의 공통 제품 개선</text><path d="M1268,618 L1268,674 L1080,674" fill="none" stroke="#7350ad" stroke-width="4" marker-end="url(#arrow)"/><line x1="64" y1="870" x2="1472" y2="870" stroke="#d9d1e5" stroke-width="2"/><text x="64" y="916" font-size="27" fill="#656078" font-weight="400">고객과 가까이 일하는 방식입니다. 모든 기업에서 장기 상주하거나 같은 범위를 맡는 것은 아닙니다.</text></svg>