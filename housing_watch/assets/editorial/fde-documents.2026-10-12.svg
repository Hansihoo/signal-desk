<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#7350ad" stroke-width="2"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#fbfaff"/><text x="64" y="64" font-size="25" fill="#7350ad" font-weight="700">04 / 문서 기업의 적용 예제</text><text x="64" y="132" font-size="47" fill="#29243e" font-weight="700">견적서 한 건을 다음 업무까지 연결합니다</text><text x="64" y="192" font-size="29" fill="#656078" font-weight="400">가상 사례: 10개 × 50,000원 = 500,000원 (부가세·추가 비용 제외)</text><rect x="64" y="284" width="304" height="306" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="88" y="333" font-size="28" fill="#7350ad" font-weight="700">01 · 주문 값</text><text x="88" y="398" font-size="27" fill="#29243e" font-weight="700">O1001 · 가온기계</text><text x="88" y="466" font-size="25" fill="#656078" font-weight="400">밸브 A / 10개</text><text x="88" y="518" font-size="25" fill="#656078" font-weight="400">확정 단가 50,000원</text><rect x="432" y="284" width="304" height="306" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="456" y="333" font-size="28" fill="#7350ad" font-weight="700">02 · 문서 생성</text><text x="456" y="398" font-size="27" fill="#29243e" font-weight="700">회사 견적 양식</text><text x="456" y="466" font-size="25" fill="#656078" font-weight="400">확정 값을 항목에 넣기</text><text x="456" y="518" font-size="25" fill="#656078" font-weight="400">500,000원 초안</text><rect x="800" y="284" width="304" height="306" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="824" y="333" font-size="28" fill="#7350ad" font-weight="700">03 · 검토·승인</text><text x="824" y="398" font-size="27" fill="#29243e" font-weight="700">고객의 확인</text><text x="824" y="466" font-size="25" fill="#656078" font-weight="400">수량 · 단가 · 금액 검토</text><text x="824" y="518" font-size="25" fill="#656078" font-weight="400">승인 후 최종 파일 생성</text><rect x="1168" y="284" width="304" height="306" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="1192" y="333" font-size="28" fill="#7350ad" font-weight="700">04 · 결과 보관</text><text x="1192" y="398" font-size="27" fill="#29243e" font-weight="700">PDF + 주문 기록</text><text x="1192" y="466" font-size="25" fill="#656078" font-weight="400">견적 PDF 저장</text><text x="1192" y="518" font-size="25" fill="#656078" font-weight="400">O1001에 기록 연결</text><path d="M384,437 L416,437" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><path d="M752,437 L784,437" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><path d="M1120,437 L1152,437" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><rect x="64" y="646" width="1408" height="156" rx="12" fill="#efe9f8" stroke="#7350ad" stroke-width="2"/><text x="98" y="700" font-size="30" fill="#7350ad" font-weight="700">FDE가 구현하는 부분</text><text x="98" y="758" font-size="36" fill="#29243e" font-weight="700">주문 값 읽기 · 양식 연결 · 검토 화면 전달 · 승인된 파일 보관</text><line x1="64" y1="870" x2="1472" y2="870" stroke="#d9d1e5" stroke-width="2"/><text x="64" y="916" font-size="27" fill="#656078" font-weight="400">단가가 미확정이면 확인을 받습니다. 실제 고객 시스템을 실행한 결과가 아닌 설명용 예제입니다.</text></svg>