<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#7350ad" stroke-width="2"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#fbfaff"/><text x="64" y="64" font-size="25" fill="#7350ad" font-weight="700">03 / 문제와 결과</text><text x="64" y="132" font-size="47" fill="#29243e" font-weight="700">자동화부터 새로운 서비스까지</text><text x="64" y="192" font-size="29" fill="#656078" font-weight="400">사례마다 입력과 결과를 보면 적용 범위가 드러납니다.</text><rect x="64" y="250" width="1408" height="170" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="96" y="301" font-size="31" fill="#7350ad" font-weight="700">Expedia / Atlassian FDE</text><text x="96" y="362" font-size="27" fill="#656078" font-weight="400">FDE 적용 사례</text><text x="700" y="301" font-size="35" fill="#29243e" font-weight="700">Confluence 콘텐츠 운영</text><text x="700" y="362" font-size="28" fill="#656078" font-weight="400">페이지 보관 등 기존 문서 관리 업무 개선</text><rect x="64" y="445" width="1408" height="170" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="96" y="496" font-size="31" fill="#7350ad" font-weight="700">Amwins / 문서 추출</text><text x="96" y="557" font-size="27" fill="#656078" font-weight="400">FDE 파견 미확인</text><text x="700" y="496" font-size="35" fill="#29243e" font-weight="700">보험 문서 → 내부 항목</text><text x="700" y="557" font-size="28" fill="#656078" font-weight="400">문서의 정보를 내부 업무에 넣는 연결</text><rect x="64" y="640" width="1408" height="170" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="96" y="691" font-size="31" fill="#7350ad" font-weight="700">NFL / AWS FDE</text><text x="96" y="752" font-size="27" fill="#656078" font-weight="400">FDE 적용 사례</text><text x="700" y="691" font-size="35" fill="#29243e" font-weight="700">팬 대상 AI 서비스</text><text x="700" y="752" font-size="28" fill="#656078" font-weight="400">NFL Fantasy AI · NFL IQ를 함께 구현</text><line x1="64" y1="870" x2="1472" y2="870" stroke="#d9d1e5" stroke-width="2"/><text x="64" y="916" font-size="27" fill="#656078" font-weight="400">Amwins는 문서 업무 적용 사례입니다. 자료에서 담당자의 FDE 직함이나 파견은 확인되지 않았습니다.</text></svg>