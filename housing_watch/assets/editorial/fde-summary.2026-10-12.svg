<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#7350ad" stroke-width="2"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#fbfaff"/><text x="64" y="64" font-size="25" fill="#7350ad" font-weight="700">FDE / 한눈에 보는 네 가지 질문</text><text x="64" y="132" font-size="47" fill="#29243e" font-weight="700">FDE가 만드는 것은 고객 업무의 변화입니다</text><text x="64" y="192" font-size="29" fill="#656078" font-weight="400">고객 문제 → 제품 적용 → 실제 사용</text><rect x="64" y="250" width="672" height="266" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="94" y="298" font-size="28" fill="#7350ad" font-weight="700">01 · 어떤 역할인가?</text><text x="94" y="356" font-size="38" fill="#29243e" font-weight="700">고객의 문제를 구체화</text><text x="94" y="416" font-size="29" fill="#656078" font-weight="400">공급사의 기술을 고객 업무에 연결</text><text x="94" y="464" font-size="29" fill="#656078" font-weight="400">실제로 쓸 수 있는 해결책 구현</text><rect x="800" y="250" width="672" height="266" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="830" y="298" font-size="28" fill="#7350ad" font-weight="700">02 · 왜 주목받는가?</text><text x="830" y="356" font-size="38" fill="#29243e" font-weight="700">AI 기능 이후의 적용</text><text x="830" y="416" font-size="29" fill="#656078" font-weight="400">데이터·규칙·프로그램의 연결 필요</text><text x="830" y="464" font-size="29" fill="#656078" font-weight="400">기존 역할이 기업 AI 도입으로 확대</text><rect x="64" y="556" width="672" height="266" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="94" y="604" font-size="28" fill="#7350ad" font-weight="700">03 · 무엇을 해결하는가?</text><text x="94" y="662" font-size="38" fill="#29243e" font-weight="700">업무 개선과 새 서비스</text><text x="94" y="722" font-size="29" fill="#656078" font-weight="400">반복 작업 · 기업 정보 활용</text><text x="94" y="770" font-size="29" fill="#656078" font-weight="400">고객을 위한 새로운 기능과 서비스</text><rect x="800" y="556" width="672" height="266" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="830" y="604" font-size="28" fill="#7350ad" font-weight="700">04 · 문서 기업의 기회는?</text><text x="830" y="662" font-size="38" fill="#29243e" font-weight="700">문서와 다음 업무 연결</text><text x="830" y="722" font-size="29" fill="#656078" font-weight="400">생성 · 추출 · 승인 · 보관</text><text x="830" y="770" font-size="29" fill="#656078" font-weight="400">고객 시스템까지 이어지는 문서 처리</text><line x1="64" y1="870" x2="1472" y2="870" stroke="#d9d1e5" stroke-width="2"/><text x="64" y="916" font-size="27" fill="#656078" font-weight="400">역할은 기존에 존재했습니다. 최근 기업 AI 도입을 위한 적용과 조직이 확대되고 있습니다.</text></svg>