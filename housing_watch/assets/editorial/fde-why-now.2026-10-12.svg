<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="960" viewBox="0 0 1536 960"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#7350ad" stroke-width="2"/></marker></defs><style>text{font-family:'Malgun Gothic',sans-serif}</style><rect width="100%" height="100%" fill="#fbfaff"/><text x="64" y="64" font-size="25" fill="#7350ad" font-weight="700">02 / 기업 AI 도입</text><text x="64" y="132" font-size="47" fill="#29243e" font-weight="700">기능을 이용할 수 있어도 적용 작업은 남습니다</text><text x="64" y="192" font-size="29" fill="#656078" font-weight="400">같은 제품을 쓰는 회사도 데이터와 업무 절차가 다릅니다.</text><rect x="64" y="270" width="430" height="456" rx="12" fill="#fff" stroke="#d9d1e5" stroke-width="2"/><text x="98" y="326" font-size="34" fill="#29243e" font-weight="700">제품이 제공하는 기능</text><text x="98" y="412" font-size="33" fill="#656078" font-weight="400">문서를 읽기</text><text x="98" y="478" font-size="33" fill="#656078" font-weight="400">초안 만들기</text><text x="98" y="544" font-size="33" fill="#656078" font-weight="400">값을 추출하기</text><text x="98" y="610" font-size="33" fill="#656078" font-weight="400">양식에 값 넣기</text><rect x="620" y="270" width="852" height="456" rx="12" fill="#efe9f8" stroke="#7350ad" stroke-width="2"/><text x="660" y="326" font-size="34" fill="#7350ad" font-weight="700">고객의 업무에 맞춰 남는 연결</text><text x="660" y="406" font-size="31" fill="#29243e" font-weight="400">데이터   어느 자료가 확정 값인가?</text><text x="660" y="480" font-size="31" fill="#29243e" font-weight="400">규칙       누가 무엇을 확인해야 하는가?</text><text x="660" y="554" font-size="31" fill="#29243e" font-weight="400">프로그램 결과를 어느 화면에 넣는가?</text><text x="660" y="628" font-size="31" fill="#29243e" font-weight="400">완료       승인 후 어디에 남기는가?</text><path d="M512,498 L602,498" fill="none" stroke="#7350ad" stroke-width="5" marker-end="url(#arrow)"/><text x="64" y="808" font-size="37" fill="#7350ad" font-weight="700">FDE는 이 연결을 찾아 실제 업무 시스템으로 구현합니다.</text><line x1="64" y1="870" x2="1472" y2="870" stroke="#d9d1e5" stroke-width="2"/><text x="64" y="916" font-size="27" fill="#656078" font-weight="400">조직 확대 발표는 관심과 투자 의지의 근거입니다. 전체 시장 성장률이나 효과를 입증하지는 않습니다.</text></svg>